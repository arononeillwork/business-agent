name: Deploy camera uploads
# The camera upload server (cameras/): the FTP server on Fly.io, in Madrid, that every business's
# cameras send pictures and video to (docs/INTEGRATIONS.md section 20). It passes the video on to
# the app, which keeps it in the business's Google Drive or OneDrive. Separate from the app's
# deploy because Cloudflare can't take FTP; until it's deployed, the Cameras page says camera
# uploads aren't switched on yet. Once CAMERA_UPLOADS is on (below), run it from the Actions tab;
# after that, pushes to main that change cameras/ deploy it again.
# Each run makes a fresh key and gives it to both (CAMERA_UPLOADS_KEY), with the server's addresses
# for the app (CAMERA_UPLOADS_URL, CAMERA_FTP_HOST), so there is nothing to copy by hand.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['cameras/**', '.github/workflows/deploy-cameras.yml']

concurrency:
  group: deploy-cameras
  cancel-in-progress: false

jobs:
  deploy:
    # Off until the repo variable CAMERA_UPLOADS is "on" (Settings → Secrets and variables → Actions →
    # Variables). Before setting it: a Fly.io account with a card on it, and its token as the repo
    # secret FLY_API_TOKEN (fly.io → Tokens → Create token, or `fly tokens create org`). Optional
    # variables: FLY_ORG (the Fly organisation, "personal" when not set) and FLY_CAMERAS_APP (the
    # app's name on Fly, when "business-agent-cameras" is taken).
    if: vars.CAMERA_UPLOADS == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FLY_APP: ${{ vars.FLY_CAMERAS_APP || 'business-agent-cameras' }}
      FLY_ORG: ${{ vars.FLY_ORG || 'personal' }}
      # Where the server sends video: the app's Worker.
      APP_URL: https://business-agent.arononeillwork.workers.dev
    steps:
      - name: Check the tokens are set
        id: gate
        run: |
          missing=""
          [ -n "$FLY_API_TOKEN" ] || missing="$missing FLY_API_TOKEN"
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          if [ -n "$missing" ]; then
            echo "::warning::Add the repo secret(s)$missing to deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.gate.outputs.ready == 'true'
        run: npm ci
      - name: Test it, with ffmpeg and curl as the camera
        if: steps.gate.outputs.ready == 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          npx vitest run cameras
      - name: Install flyctl
        if: steps.gate.outputs.ready == 'true'
        run: |
          curl -fsSL https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"
      - name: The app on Fly, with its own IPv4 address for FTP
        id: app
        if: steps.gate.outputs.ready == 'true'
        run: |
          if ! flyctl apps list --json | jq -e --arg a "$FLY_APP" '.[] | select((.Name // .name) == $a)' > /dev/null; then
            flyctl apps create "$FLY_APP" --org "$FLY_ORG"
          fi
          v4='[.[] | select((.Type // .type) == "v4")]'
          if [ "$(flyctl ips list -a "$FLY_APP" --json | jq "$v4 | length")" = 0 ]; then
            flyctl ips allocate-v4 -a "$FLY_APP" --yes
          fi
          ip=$(flyctl ips list -a "$FLY_APP" --json | jq -r "$v4[0] | (.Address // .address)")
          if [ -z "$ip" ] || [ "$ip" = null ]; then echo "::error::No IPv4 address for $FLY_APP"; exit 1; fi
          echo "ip=$ip" >> "$GITHUB_OUTPUT"
          echo "### Camera uploads at $FLY_APP.fly.dev ($ip)" >> "$GITHUB_STEP_SUMMARY"
      - name: Share a fresh key and the addresses with the app
        if: steps.gate.outputs.ready == 'true'
        run: |
          key=$(openssl rand -base64 33 | tr '+/' '-_' | tr -d '=\n')
          echo "::add-mask::$key"
          flyctl secrets set -a "$FLY_APP" --stage CAMERA_UPLOADS_KEY="$key" APP_URL="$APP_URL" PUBLIC_IP="${{ steps.app.outputs.ip }}" PUBLIC_HOST="$FLY_APP.fly.dev"
          printf '%s' "$key" | npx wrangler secret put CAMERA_UPLOADS_KEY --name business-agent
          printf '%s' "https://$FLY_APP.fly.dev" | npx wrangler secret put CAMERA_UPLOADS_URL --name business-agent
          printf '%s' "$FLY_APP.fly.dev" | npx wrangler secret put CAMERA_FTP_HOST --name business-agent
      - name: Deploy (Fly builds the image from cameras/)
        if: steps.gate.outputs.ready == 'true'
        working-directory: cameras
        run: flyctl deploy -a "$FLY_APP" --remote-only --ha=false
      - name: Check it answers
        if: steps.gate.outputs.ready == 'true'
        run: |
          sleep 5
          curl -fsS "https://$FLY_APP.fly.dev/health" | tee -a "$GITHUB_STEP_SUMMARY"
