name: CI
# Every push and pull request: typecheck, unit tests, database rules on a real Postgres, and the
# browser tests against the demo. A red run means don't deploy.
on:
  push:
    # These branches run the same checks inside deploy.yml before deploying.
    branches-ignore: [main, claude/easy-beans-architecture-plan-dknqka]
  pull_request:
  workflow_call:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Database tests
        run: npm run test:db
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser tests (demo)
        run: npm run test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
