name: Probe sports sources
# Fetches sample responses from sports data sources so parsers are built and tested against
# real data (this container can't reach them). Runs when this file changes.
on:
  push:
    branches: [claude/easy-beans-architecture-plan-dknqka]
    paths: [.github/workflows/probe-sports.yml]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          from=$(date -u +%Y%m%d); to=$(date -u -d '+21 days' +%Y%m%d); to60=$(date -u -d '+60 days' +%Y%m%d)
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0 Safari/537.36'
          probe() {
            echo "=== $1"
            code=$(curl -s -m 25 -A "$UA" -o body.txt -w '%{http_code} %{content_type}' "$2")
            echo "status: $code  bytes: $(wc -c < body.txt)"
            head -c ${3:-1200} body.txt | tr '\n' ' '; echo
          }
          probe "espn laliga" "https://site.api.espn.com/apis/site/v2/sports/soccer/esp.1/scoreboard?dates=$from-$to" 4000
          probe "espn nations" "https://site.api.espn.com/apis/site/v2/sports/soccer/uefa.nations/scoreboard?dates=$from-$to" 800
          probe "espn friendlies" "https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.friendly/scoreboard?dates=$from-$to" 800
          probe "espn wcq uefa" "https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.worldq.uefa/scoreboard?dates=$from-$to" 800
          probe "espn ufc range" "https://site.api.espn.com/apis/site/v2/sports/mma/ufc/scoreboard?dates=$from-$to60" 4000
          probe "espn ufc default" "https://site.api.espn.com/apis/site/v2/sports/mma/ufc/scoreboard" 1500
          probe "espn boxing" "https://site.api.espn.com/apis/site/v2/sports/boxing/scoreboard" 600
          probe "sportsdb boxing next" "https://www.thesportsdb.com/api/v1/json/3/eventsnextleague.php?id=4445" 3000
          probe "sportsdb boxing season" "https://www.thesportsdb.com/api/v1/json/3/eventsseason.php?id=4445&s=$(date -u +%Y)" 1500
          probe "sportsdb ufc next" "https://www.thesportsdb.com/api/v1/json/3/eventsnextleague.php?id=4443" 1500
          probe "sportsdb laliga next" "https://www.thesportsdb.com/api/v1/json/3/eventsnextleague.php?id=4335" 1500
