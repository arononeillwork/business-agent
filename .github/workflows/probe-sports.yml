name: Probe sports sources
# Fetches sample responses from sports data sources so parsers are built and tested against
# real data (this container can't reach them). Runs when this file changes.
on:
  push:
    branches: [claude/easy-beans-architecture-plan-dknqka]
    paths: [.github/workflows/probe-sports.yml]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          B=https://www.thesportsdb.com/api/v1/json/3
          j() { curl -s -m 25 "$1"; sleep 2.2; }
          echo "=== leagues matching"
          j "$B/all_leagues.php" | jq -r '.leagues[] | select(.strSport=="Soccer" or .strSport=="Fighting") | "\(.idLeague)\t\(.strSport)\t\(.strLeague)"' \
            | grep -Ei 'la liga|segunda|copa del rey|premier league|championship|fa cup|eredivisie|bundesliga|serie a|ligue 1|primeira|scottish prem|champions league|europa|conference|nations league|world cup|euro|friendl|qualif|ufc|boxing|mma' | head -60
          for id in 4335 4328 4480 4396 4490 4443 4445; do
            echo "=== league $id next"
            j "$B/eventsnextleague.php?id=$id" | jq -c '[.events[]? | {idEvent, strEvent, strTimestamp, intRound, strSeason, strStatus}]'
          done
          echo "=== round counts (La Liga 2026-2027 rounds 7..10)"
          for r in 7 8 9 10; do j "$B/eventsround.php?id=4335&r=$r&s=2026-2027" | jq -c "{r: $r, n: (.events|length), first: .events[0].strEvent, ts: .events[0].strTimestamp}"; done
          echo "=== season counts"
          for x in "4335 2026-2027" "4328 2026-2027" "4443 2026" "4445 2026" "4480 2026-2027"; do set -- $x
            j "$B/eventsseason.php?id=$1&s=$2" | jq -c "{id: \"$1\", s: \"$2\", n: (.events|length), last: .events[-1].strTimestamp}"; done
          echo "=== day listing"
          j "$B/eventsday.php?d=$(date -u -d '+7 days' +%F)&s=Soccer" | jq -c '{n: (.events|length), sample: [.events[0:3][]? | {strEvent, strLeague, idLeague}]}'
          j "$B/eventsday.php?d=$(date -u -d '+7 days' +%F)&s=Fighting" | jq -c '{n: (.events|length), sample: [.events[0:3][]? | {strEvent, strLeague}]}'
