name: Feature board
# Keeps the owner's feature board current: after every CI, merge queue and Deploy run starts or
# finishes, and every day at 9:00 and 18:00 in Spain, works out which features are in development,
# in review and the merge queue, deploying or live and checked, and what each of the app's features
# needs and has (scripts/ops/dev-board.mjs, ops/features.json), and saves it to ops.dev_board in
# Supabase for the dashboard. workflow_run, schedule and delete only fire from the default branch.
on:
  workflow_run:
    workflows: [CI, Merge queue, Deploy, Live end-to-end tests]
    types: [requested, completed]
  # 9:00 and 18:00 in Spain: 7:03 and 16:03 UTC in summer time, 8:03 and 17:03 in winter. Both
  # pairs fire; the job keeps the one that is 9 and 6 in Madrid today. Off the hour, as GitHub
  # delays runs scheduled at :00.
  schedule:
    - cron: '3 7,16 * * *'
    - cron: '3 8,17 * * *'
  delete:
  # No push trigger: on a branch it would save that branch's version of the board, and a newer run
  # cancelling it left a cancelled check on the pull request, which the merge queue counts as red.
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

# Each run reads everything afresh, so only the newest one matters.
concurrency:
  group: dev-board
  cancel-in-progress: true

jobs:
  board:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: At 9:00 and 18:00 in Spain only
        id: when
        if: github.event_name == 'schedule'
        env:
          CRON: ${{ github.event.schedule }}
        run: |
          offset=$(TZ=Europe/Madrid date +%z)
          case "$CRON|$offset" in
            '3 7,16 * * *|+0200'|'3 8,17 * * *|+0100') echo "go=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "go=false" >> "$GITHUB_OUTPUT"; echo "This pair isn't 9:00 or 18:00 in Madrid today (offset $offset); the other one runs." ;;
          esac
      - uses: actions/checkout@v4
        if: steps.when.outputs.go != 'false'
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: steps.when.outputs.go != 'false'
        with:
          node-version: 22
      - run: node scripts/ops/dev-board.mjs
        if: steps.when.outputs.go != 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # Whether each app key in ops/features.json is set: true or false, never the key itself.
          HAS_APPLE_CLIENT_ID: ${{ secrets.APPLE_CLIENT_ID != '' }}
          HAS_ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY != '' }}
          HAS_EMAIL_FORWARD_TO: ${{ secrets.EMAIL_FORWARD_TO != '' }}
          HAS_FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN != '' }}
          HAS_GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN != '' }}
          HAS_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID != '' }}
          HAS_GOOGLE_FONTS_API_KEY: ${{ secrets.GOOGLE_FONTS_API_KEY != '' }}
          HAS_GOOGLE_PAGESPEED_API_KEY: ${{ secrets.GOOGLE_PAGESPEED_API_KEY != '' }}
          HAS_GOOGLE_PICKER_API_KEY: ${{ secrets.GOOGLE_PICKER_API_KEY != '' }}
          HAS_GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY != '' }}
          HAS_GOOGLE_PLACE_ID: ${{ secrets.GOOGLE_PLACE_ID != '' }}
          HAS_INSTAGRAM_APP_ID: ${{ secrets.INSTAGRAM_APP_ID != '' }}
          HAS_LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID != '' }}
          HAS_META_APP_ID: ${{ secrets.META_APP_ID != '' }}
          HAS_SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID != '' }}
          HAS_SQUARE_APP_ID: ${{ secrets.SQUARE_APP_ID != '' }}
          HAS_STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY != '' }}
          HAS_SUMUP_CLIENT_ID: ${{ secrets.SUMUP_CLIENT_ID != '' }}
          HAS_TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY != '' }}
          HAS_WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID != '' }}
