name: Uptime monitor
# Every 15 minutes: checks the live app is up, the sign-in page loads, Supabase answers and
# email, Google and Microsoft sign-in are all switched on. A failure emails the repo owner
# (GitHub's default for failed scheduled workflows).
# Set in repo Settings → Secrets and variables → Actions:
#   variable PRODUCTION_URL (default: the workers.dev address)
#   optional secrets SMOKE_EMAIL / SMOKE_PASSWORD for a low-privilege test account
#   optional variable EXPECT_PROVIDERS (default "email" until Google and Microsoft are on)
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Smoke test production
        run: npx playwright test e2e/smoke.spec.ts --project desktop
        env:
          CI: true
          E2E_BASE_URL: ${{ vars.PRODUCTION_URL || 'https://business-agent.arononeillwork.workers.dev' }}
          # Raise to email,google,microsoft once both are switched on.
          EXPECT_PROVIDERS: ${{ vars.EXPECT_PROVIDERS || 'email' }}
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
