name: Deploy
# Push to main → run every test (unless the merge queue just ran them on this exact commit) →
# apply new database migrations → deploy the Worker to Cloudflare → sync its secrets → point
# Supabase sign-in at the live URL → smoke-test the live site.
# Repo secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   required ("Edit Cloudflare Workers" template)
#   CLOUDFLARE_ACCOUNT_ID  only if the token can see more than one account
#   SUPABASE_ACCESS_TOKEN  Supabase personal access token (service key + Auth settings)
#   GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET, META_*, APPLE_*, SPOTIFY_*  optional integrations
#   ANTHROPIC_API_KEY      optional: the in-app assistant (Claude)
# "Log in with Facebook" is on; repo variable FACEBOOK_SIGN_IN=off switches it off (docs/sign-in-setup.md).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # A commit the merge queue landed passed every test minutes ago, as this very commit.
  tested:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      statuses: read
    outputs:
      skip: ${{ steps.status.outputs.skip }}
    steps:
      - id: status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/statuses" \
            --jq '[.[] | select(.context == "merge-queue")][0].state // ""' 2>/dev/null || true)
          if [ "$state" = success ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Every test already passed on this commit in the merge queue, so they don't run again." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: tested
    if: needs.tested.outputs.skip != 'true'
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: [tested, test]
    if: ${{ !cancelled() && needs.tested.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only the deploy itself waits its turn, not the live tests after the previous one (they have
    # their own queue); a newer push replaces one that's waiting.
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
      WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
      WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
      INSTAGRAM_APP_ID: ${{ secrets.INSTAGRAM_APP_ID }}
      STRIPE_CLIENT_ID: ${{ secrets.STRIPE_CLIENT_ID }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      INSTAGRAM_APP_SECRET: ${{ secrets.INSTAGRAM_APP_SECRET }}
      META_APP_ID: ${{ secrets.META_APP_ID }}
      FACEBOOK_SIGN_IN: ${{ vars.FACEBOOK_SIGN_IN || 'on' }}
      APPLE_CLIENT_ID: ${{ secrets.APPLE_CLIENT_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
      APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      SQUARE_APP_ID: ${{ secrets.SQUARE_APP_ID }}
      SQUARE_APP_SECRET: ${{ secrets.SQUARE_APP_SECRET }}
      SQUARE_ENVIRONMENT: ${{ secrets.SQUARE_ENVIRONMENT }}
      SQUARE_REDIRECT_URL: ${{ secrets.SQUARE_REDIRECT_URL }}
      SQUARE_WEBHOOK_SIGNATURE_KEY: ${{ secrets.SQUARE_WEBHOOK_SIGNATURE_KEY }}
      SQUARE_WEBHOOK_URL: ${{ secrets.SQUARE_WEBHOOK_URL }}
      SUMUP_CLIENT_ID: ${{ secrets.SUMUP_CLIENT_ID }}
      SUMUP_CLIENT_SECRET: ${{ secrets.SUMUP_CLIENT_SECRET }}
      LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
      LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
      LINKEDIN_PAGES: ${{ vars.LINKEDIN_PAGES }}
      GOOGLE_FONTS_API_KEY: ${{ secrets.GOOGLE_FONTS_API_KEY }}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
      GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
      GOOGLE_PLACE_ID: ${{ secrets.GOOGLE_PLACE_ID }}
      GOOGLE_PAGESPEED_API_KEY: ${{ secrets.GOOGLE_PAGESPEED_API_KEY }}
      GOOGLE_PICKER_API_KEY: ${{ secrets.GOOGLE_PICKER_API_KEY }}
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      # AI music for stories and reels (docs/SOCIAL_MUSIC_PLAN.md): Business Agent's own ElevenLabs account.
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      # The in-app assistant (worker/assistant.ts): Claude, billed to this Anthropic account. Off without it.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Optional repo variables: the model (after Actions → Music check), and "off" to stop the starter pack.
      ELEVENLABS_MUSIC_MODEL: ${{ vars.ELEVENLABS_MUSIC_MODEL }}
      MUSIC_STARTER: ${{ vars.MUSIC_STARTER }}
    steps:
      - name: Check the Cloudflare token is set
        id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Add the CLOUDFLARE_API_TOKEN repo secret to deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.gate.outputs.ready == 'true'
        run: npm ci
      - name: Check the Cloudflare token works
        if: steps.gate.outputs.ready == 'true'
        # Exports the cleaned CLOUDFLARE_API_TOKEN (and account ID) for the steps after it.
        env:
          CF_TOKEN_SECRET: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ops/cloudflare-token.mjs
      - name: Photo storage (R2)
        if: steps.gate.outputs.ready == 'true'
        run: node scripts/ops/r2.mjs
      - name: Build
        if: steps.gate.outputs.ready == 'true'
        run: npm run build
      # New files in supabase/migrations go into the live database before the Worker that needs
      # them goes out; a failure stops the deploy here (scripts/ops/migrate.mjs).
      - name: Database migrations
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -o pipefail
          node scripts/ops/migrate.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Deploy the Worker
        id: deploy
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -o pipefail
          npx wrangler deploy --var "GIT_SHA:$GITHUB_SHA" --var "DEPLOYED_AT:$(date -u +%Y-%m-%dT%H:%M:%SZ)" 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Live at $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Custom domain
        id: domain
        if: steps.gate.outputs.ready == 'true'
        run: node scripts/ops/custom-domain.mjs
      # hello@, sales@ and support@ the domain, forwarded to the Gmail in EMAIL_FORWARD_TO (docs/business-email.md).
      - name: Business email
        if: steps.gate.outputs.ready == 'true'
        env:
          EMAIL_FORWARD_TO: ${{ secrets.EMAIL_FORWARD_TO }}
        run: node scripts/ops/email-routing.mjs
      - name: Sync Worker secrets
        if: steps.gate.outputs.ready == 'true'
        run: |
          npx wrangler secret list --format json > existing.json 2>/dev/null || echo '[]' > existing.json
          node scripts/ops/worker-secrets.mjs existing.json "$RUNNER_TEMP/secrets.json"
          if [ "$(cat "$RUNNER_TEMP/secrets.json")" != "{}" ]; then npx wrangler secret bulk "$RUNNER_TEMP/secrets.json"; fi
          rm -f "$RUNNER_TEMP/secrets.json"
      - name: Point Supabase sign-in at the live site
        if: steps.gate.outputs.ready == 'true' && steps.deploy.outputs.url != ''
        # The custom domain once it's live; the workers.dev URL goes along so it stays in the
        # sign-in redirect allow list (sign-ins started on workers.dev must come back to it).
        run: |
          set -o pipefail
          node scripts/ops/supabase-auth.mjs "${{ steps.domain.outputs.site || steps.deploy.outputs.url }}" "${{ steps.deploy.outputs.url }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Stripe billing webhook
        if: steps.gate.outputs.ready == 'true' && steps.deploy.outputs.url != ''
        run: |
          set -o pipefail
          node scripts/ops/stripe-billing.mjs "${{ steps.domain.outputs.site || steps.deploy.outputs.url }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Stripe prices (match shared/plans.ts, archive old ones)
        if: steps.gate.outputs.ready == 'true' && steps.deploy.outputs.url != ''
        run: |
          set -o pipefail
          node --experimental-strip-types scripts/ops/stripe-prices.ts | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Smoke-test the live site
        if: steps.gate.outputs.ready == 'true' && steps.deploy.outputs.url != ''
        run: |
          npx playwright install --with-deps chromium
          sleep 10
          npx playwright test e2e/smoke.spec.ts --project desktop
        env:
          CI: true
          E2E_BASE_URL: ${{ steps.domain.outputs.site || steps.deploy.outputs.url }}
          # Only require the methods that are configured so far; the monitor checks all three.
          EXPECT_PROVIDERS: email

  # Boxing, friendlies and cups (TheSportsDB) from GitHub's servers; see sports-sync.yml.
  sports:
    needs: deploy
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    uses: ./.github/workflows/sports-sync.yml
    secrets: inherit

  # The whole app, every role, against the version just deployed.
  live:
    needs: deploy
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    uses: ./.github/workflows/live-e2e.yml
    with:
      url: https://business-agent.arononeillwork.workers.dev
    secrets: inherit
