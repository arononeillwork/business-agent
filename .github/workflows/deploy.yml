name: Deploy
# Push to this branch or main → run every test → deploy the Worker to Cloudflare → sync its
# secrets → point Supabase sign-in at the live URL → smoke-test the live site.
# Repo secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   required ("Edit Cloudflare Workers" template)
#   CLOUDFLARE_ACCOUNT_ID  only if the token can see more than one account
#   SUPABASE_ACCESS_TOKEN  Supabase personal access token (service key + Auth settings)
#   GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET, META_*, SPOTIFY_*  optional integrations
on:
  push:
    branches: [main, claude/easy-beans-architecture-plan-dknqka]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
      WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
      WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
      INSTAGRAM_APP_ID: ${{ secrets.INSTAGRAM_APP_ID }}
      INSTAGRAM_APP_SECRET: ${{ secrets.INSTAGRAM_APP_SECRET }}
      META_APP_ID: ${{ secrets.META_APP_ID }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      SQUARE_APP_ID: ${{ secrets.SQUARE_APP_ID }}
      SQUARE_APP_SECRET: ${{ secrets.SQUARE_APP_SECRET }}
      SQUARE_ENVIRONMENT: ${{ secrets.SQUARE_ENVIRONMENT }}
      GOOGLE_FONTS_API_KEY: ${{ secrets.GOOGLE_FONTS_API_KEY }}
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
    steps:
      - name: Check the Cloudflare token is set
        id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Add the CLOUDFLARE_API_TOKEN repo secret to deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.gate.outputs.ready == 'true'
        run: npm ci
      - name: Check the Cloudflare token works
        if: steps.gate.outputs.ready == 'true'
        # Exports the cleaned CLOUDFLARE_API_TOKEN (and account ID) for the steps after it.
        env:
          CF_TOKEN_SECRET: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ops/cloudflare-token.mjs
      - name: Photo storage (R2)
        if: steps.gate.outputs.ready == 'true'
        run: node scripts/ops/r2.mjs
      - name: Build
        if: steps.gate.outputs.ready == 'true'
        run: npm run build
      - name: Deploy the Worker
        id: deploy
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Live at $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Sync Worker secrets
        if: steps.gate.outputs.ready == 'true'
        run: |
          npx wrangler secret list --format json > existing.json 2>/dev/null || echo '[]' > existing.json
          node scripts/ops/worker-secrets.mjs existing.json "$RUNNER_TEMP/secrets.json"
          if [ "$(cat "$RUNNER_TEMP/secrets.json")" != "{}" ]; then npx wrangler secret bulk "$RUNNER_TEMP/secrets.json"; fi
          rm -f "$RUNNER_TEMP/secrets.json"
      - name: Point Supabase sign-in at the live site
        if: steps.gate.outputs.ready == 'true' && steps.deploy.outputs.url != ''
        run: node scripts/ops/supabase-auth.mjs "${{ steps.deploy.outputs.url }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Smoke-test the live site
        if: steps.gate.outputs.ready == 'true' && steps.deploy.outputs.url != ''
        run: |
          npx playwright install --with-deps chromium
          sleep 10
          npx playwright test e2e/smoke.spec.ts --project desktop
        env:
          CI: true
          E2E_BASE_URL: ${{ steps.deploy.outputs.url }}
          # Only require the methods that are configured so far; the monitor checks all three.
          EXPECT_PROVIDERS: email

  # Boxing, friendlies and cups (TheSportsDB) from GitHub's servers; see sports-sync.yml.
  sports:
    needs: deploy
    uses: ./.github/workflows/sports-sync.yml
    secrets: inherit

  # The whole app, every role, against the version just deployed.
  live:
    needs: deploy
    uses: ./.github/workflows/live-e2e.yml
    with:
      url: https://business-agent.arononeillwork.workers.dev
    secrets: inherit
